<!DOCTYPE html>
<html>
<head>
    <title>Book App</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }
        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        .card {
            background: white;
            color: black;
            width: 200px;
            margin: 20px;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.5);
        }
        img {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>📚 Book Library</h1>

<div class="container">
    {% for book in books %}
    <div class="card">
        <img src="{{ url_for('static', filename='images/' + book.image) }}">
        <h3>{{ book.title }}</h3>
        <p>{{ book.author }}</p>
    </div>
    {% endfor %}
</div>

</body>
</html>
